<!doctype html>

    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ===================================================================
         REFERENCEMENT (SEO)
         Page en NOINDEX par defaut (elle ne doit pas remonter dans Google
         tant qu'elle n'est pas publique).
         >>> POUR LA RENDRE VISIBLE DANS GOOGLE : supprimer la ligne
             <meta name="robots" ...> ci-dessous.
         ==================================================================== -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Vie etudiante NEXA 2026-2027 : tous les temps forts de ton annee</title>

    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Il se passe toujours quelque chose a NEXA" />
    <meta
      property="og:description"
      content="Une annee entiere de temps forts sur les 6 campus. Choisis les tiens."
    />
    <meta property="og:image" content="/img/og-cover.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Il se passe toujours quelque chose a NEXA" />
    <meta
      name="twitter:description"
      content="Une annee entiere de temps forts sur les 6 campus. Choisis les tiens."
    />

    <!-- Polices Google : preconnect + display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
