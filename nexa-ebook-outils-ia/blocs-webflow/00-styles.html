<!--
  ============================================================
  BLOC 0 — STYLES PARTAGÉS  (NEXA · E-book Outils IA 2026)
  Thème sombre + violet électrique + vert menthe (charte NEXA).
  ------------------------------------------------------------
  À COLLER UNE SEULE FOIS :
  Webflow > Page Settings > Custom Code > "Inside <head> tag"
  (ou dans un Embed placé tout en haut de la page).
  Tous les autres blocs utilisent les classes préfixées « nx- ».
  ============================================================
-->
<style>
  .nx-lp{
    /* --- Charte NEXA (ajuste les hex si besoin) --- */
    --nx-purple:#7C3AED;
    --nx-purple-bright:#9D5CFF;
    --nx-purple-deep:#4C1D95;
    --nx-green:#18E8A6;
    --nx-green-2:#0FD196;
    --nx-dark:#0E0B1A;      /* fond de page */
    --nx-dark-2:#171429;    /* cartes */
    --nx-dark-3:#221C3D;    /* survol / bordures */
    --nx-white:#ffffff;
    --nx-body:#C7C0DB;      /* texte courant sur fond sombre */
    --nx-muted:#8E86A8;
    --nx-line:rgba(255,255,255,.10);
    --nx-radius:18px;
    --nx-shadow:0 22px 50px -22px rgba(0,0,0,.7);
    --nx-max:1080px;

    font-family:"Poppins","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--nx-body);
    line-height:1.6;
    background:var(--nx-dark);
    -webkit-font-smoothing:antialiased;
  }
  .nx-lp *{box-sizing:border-box;}

  .nx-wrap{max-width:var(--nx-max);margin:0 auto;padding:0 22px;}
  .nx-section{padding:76px 0;background:var(--nx-dark);}
  .nx-section.alt{background:#120E22;}
  .nx-eyebrow{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--nx-green);margin-bottom:14px;
  }
  .nx-h1{font-size:clamp(30px,5vw,48px);line-height:1.1;font-weight:800;color:var(--nx-white);margin:0 0 22px;}
  .nx-h2{font-size:clamp(26px,3.6vw,38px);line-height:1.14;font-weight:800;color:var(--nx-white);margin:0 0 14px;}
  .nx-h3{font-size:19px;font-weight:700;color:var(--nx-white);margin:0 0 8px;}
  .nx-lead{font-size:17px;color:var(--nx-body);}
  .nx-center{text-align:center;}
  .nx-accent{color:var(--nx-green);}

  /* --- Boutons (pilule verte, texte foncé = signature NEXA) --- */
  .nx-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:var(--nx-green);color:#08221A;text-decoration:none;font-weight:700;font-size:16px;
    padding:15px 30px;border-radius:999px;border:0;cursor:pointer;
    box-shadow:0 14px 30px -12px rgba(24,232,166,.55);
    transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
  }
  .nx-btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 20px 36px -14px rgba(24,232,166,.65);}
  .nx-btn svg{width:18px;height:18px;flex:none;}
  .nx-btn-outline{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:transparent;color:var(--nx-green);border:1.5px solid var(--nx-green);
    text-decoration:none;font-weight:700;font-size:15px;padding:12px 24px;border-radius:999px;
    transition:background .16s ease,color .16s ease;
  }
  .nx-btn-outline:hover{background:var(--nx-green);color:#08221A;}
  .nx-btn-ghost{
    display:inline-flex;align-items:center;gap:8px;color:var(--nx-green);
    font-weight:700;text-decoration:none;font-size:15px;
  }
  .nx-btn-ghost:hover{text-decoration:underline;}

  /* --- Header / nav simple --- */
  .nx-nav{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;max-width:var(--nx-max);margin:0 auto;}
  .nx-logo{font-weight:800;font-size:24px;color:var(--nx-white);letter-spacing:.06em;}
  .nx-logo .dot{color:var(--nx-green);}

  /* --- HERO --- */
  .nx-hero{
    background:
      radial-gradient(90% 80% at 78% -10%,rgba(124,58,237,.55) 0%,rgba(124,58,237,0) 60%),
      radial-gradient(70% 60% at 10% 110%,rgba(24,232,166,.16) 0%,rgba(24,232,166,0) 55%),
      var(--nx-dark);
    color:var(--nx-body);position:relative;overflow:hidden;border-bottom:1px solid var(--nx-line);
  }
  .nx-hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:48px 0 80px;}
  .nx-badge{
    display:inline-block;background:rgba(24,232,166,.12);border:1px solid rgba(24,232,166,.4);
    color:var(--nx-green);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:7px 14px;border-radius:999px;margin-bottom:20px;
  }
  .nx-checks{list-style:none;padding:0;margin:0 0 30px;display:grid;gap:14px;}
  .nx-checks li{display:flex;gap:12px;align-items:flex-start;font-size:16px;color:#E4DEF3;}
  .nx-checks .ic{
    flex:none;width:24px;height:24px;border-radius:50%;background:var(--nx-green);
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .nx-checks .ic svg{width:13px;height:13px;color:#08221A;}

  /* --- Ebook mockup (CSS, remplaçable par une image) --- */
  .nx-book-stage{display:flex;justify-content:center;align-items:center;perspective:1400px;}
  .nx-book{
    width:min(300px,80%);aspect-ratio:3/4;border-radius:10px 16px 16px 10px;
    background:linear-gradient(150deg,#4C1D95,#7C3AED 60%,#9D5CFF);
    box-shadow:0 44px 70px -28px rgba(124,58,237,.6),inset 14px 0 22px -14px rgba(0,0,0,.5);
    transform:rotateY(-16deg) rotateX(4deg);color:#fff;padding:26px 24px;
    display:flex;flex-direction:column;justify-content:space-between;border-left:6px solid rgba(0,0,0,.35);
  }
  .nx-book .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--nx-green);}
  .nx-book .t{font-size:26px;font-weight:800;line-height:1.15;}
  .nx-book .n{font-size:13px;opacity:.85;}

  /* --- Cards « découvrir » --- */
  .nx-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:38px 0 30px;}
  .nx-card{
    background:var(--nx-dark-2);border:1px solid var(--nx-line);border-radius:var(--nx-radius);
    padding:26px 24px;box-shadow:var(--nx-shadow);transition:border-color .16s ease,transform .16s ease;
  }
  .nx-card:hover{border-color:rgba(24,232,166,.45);transform:translateY(-3px);}
  .nx-logos{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .nx-logo-chip{
    width:40px;height:40px;border-radius:10px;background:var(--nx-dark-3);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--nx-green);
    font-size:12px;border:1px solid var(--nx-line);
  }
  .nx-card p{margin:0;font-size:15px;color:var(--nx-body);}

  /* --- Auteurs --- */
  .nx-authors{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;}
  .nx-photo{
    border-radius:var(--nx-radius);aspect-ratio:4/3;width:100%;object-fit:cover;
    background:linear-gradient(135deg,var(--nx-dark-2),var(--nx-purple-deep));border:1px solid var(--nx-line);
    display:flex;align-items:center;justify-content:center;color:var(--nx-muted);font-size:14px;
  }

  /* --- CTA formations (carte violette) --- */
  .nx-cta-card{
    background:linear-gradient(135deg,var(--nx-purple),var(--nx-purple-deep));
    color:#fff;border-radius:26px;padding:54px 46px;box-shadow:0 34px 64px -26px rgba(124,58,237,.6);
    border:1px solid rgba(255,255,255,.10);
  }
  .nx-cta-card .nx-h2{color:#fff;}
  .nx-cta-card p{color:rgba(255,255,255,.92);font-size:16px;max-width:640px;margin:0 0 26px;}

  /* --- Témoignages --- */
  .nx-ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px;}
  .nx-rating{
    background:var(--nx-dark-2);border:1px solid var(--nx-line);border-radius:var(--nx-radius);
    padding:26px 20px;text-align:center;box-shadow:var(--nx-shadow);
  }
  .nx-rating .score{font-size:34px;font-weight:800;color:var(--nx-white);}
  .nx-stars{color:var(--nx-green);font-size:18px;letter-spacing:2px;margin:6px 0;}
  .nx-rating .rev{font-size:13px;color:var(--nx-muted);}
  .nx-quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px;}
  .nx-quote{background:var(--nx-dark-2);border:1px solid var(--nx-line);border-radius:var(--nx-radius);padding:24px;font-size:15px;color:var(--nx-body);}
  .nx-quote .who{margin-top:14px;font-weight:700;color:var(--nx-white);font-size:14px;}

  /* --- FAQ --- */
  .nx-faq{max-width:760px;margin:32px auto 0;display:grid;gap:12px;text-align:left;}
  .nx-faq details{
    background:var(--nx-dark-2);border:1px solid var(--nx-line);border-radius:14px;padding:4px 4px;
  }
  .nx-faq summary{
    list-style:none;cursor:pointer;padding:18px 20px;font-weight:700;color:var(--nx-white);
    display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:16px;
  }
  .nx-faq summary::-webkit-details-marker{display:none;}
  .nx-faq summary::after{content:"+";color:var(--nx-green);font-size:24px;font-weight:700;line-height:1;}
  .nx-faq details[open] summary::after{content:"–";}
  .nx-faq .a{padding:0 20px 18px;color:var(--nx-body);font-size:15px;}

  /* --- Formulaire --- */
  .nx-form-band{
    background:
      radial-gradient(80% 120% at 50% -20%,rgba(124,58,237,.35),rgba(124,58,237,0) 60%),
      #120E22;
  }
  .nx-form{
    max-width:560px;margin:26px auto 0;background:var(--nx-dark-2);border:1px solid var(--nx-line);
    border-radius:var(--nx-radius);padding:30px;box-shadow:var(--nx-shadow);
  }
  .nx-form .row{display:grid;gap:14px;margin-bottom:14px;}
  @media(min-width:560px){.nx-form .row.two{grid-template-columns:1fr 1fr;}}
  .nx-form label{display:block;font-size:13px;font-weight:600;color:var(--nx-white);margin-bottom:6px;}
  .nx-form input{
    width:100%;padding:13px 15px;border:1px solid var(--nx-line);border-radius:10px;
    font-size:15px;font-family:inherit;color:var(--nx-white);background:var(--nx-dark);
  }
  .nx-form input::placeholder{color:var(--nx-muted);}
  .nx-form input:focus{outline:none;border-color:var(--nx-green);box-shadow:0 0 0 3px rgba(24,232,166,.18);}
  .nx-form .nx-btn{width:100%;margin-top:6px;}
  .nx-consent{font-size:12px;color:var(--nx-muted);margin-top:12px;text-align:center;}

  /* --- Footer --- */
  .nx-footer{background:#0A0813;color:var(--nx-body);border-top:1px solid var(--nx-line);}
  .nx-footer .nx-wrap{padding-top:54px;padding-bottom:34px;}
  .nx-foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:34px;}
  .nx-footer h4{color:#fff;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px;}
  .nx-footer a{color:var(--nx-body);text-decoration:none;}
  .nx-footer a:hover{color:var(--nx-green);}
  .nx-footer ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;font-size:15px;}
  .nx-legal{border-top:1px solid var(--nx-line);margin-top:34px;padding-top:22px;font-size:12px;color:var(--nx-muted);}
  .nx-legal p{margin:0 0 8px;}

  /* --- Responsive --- */
  @media(max-width:860px){
    .nx-hero-grid{grid-template-columns:1fr;gap:36px;}
    .nx-cards{grid-template-columns:1fr;}
    .nx-authors{grid-template-columns:1fr;gap:26px;}
    .nx-ratings,.nx-quotes{grid-template-columns:1fr;}
    .nx-foot-grid{grid-template-columns:1fr;gap:26px;}
    .nx-section{padding:54px 0;}
    .nx-cta-card{padding:38px 26px;}
    .nx-book{transform:none;}
  }
</style>
