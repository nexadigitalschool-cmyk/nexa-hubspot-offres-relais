<!--
  ============================================================
  BLOC 0 — STYLES PARTAGÉS  (NEXA · E-book Outils IA 2026)
  ------------------------------------------------------------
  À COLLER UNE SEULE FOIS :
  Webflow > Page Settings > Custom Code > "Inside <head> tag"
  (ou dans un Embed placé tout en haut de la page).
  Tous les autres blocs utilisent ces classes préfixées « nx- ».
  ============================================================
-->
<style>
  .nx-lp{
    /* --- Charte NEXA (à ajuster si besoin) --- */
    --nx-violet:#4B0082;
    --nx-violet-2:#6D28D9;
    --nx-violet-deep:#2b0a4a;
    --nx-ink:#1a1130;
    --nx-body:#4b4b57;
    --nx-muted:#8a8a99;
    --nx-soft:#F4F0FA;
    --nx-line:#e7e1f3;
    --nx-white:#ffffff;
    --nx-accent-a:#7C3AED;
    --nx-accent-b:#DB2777;
    --nx-radius:16px;
    --nx-shadow:0 18px 40px -18px rgba(75,0,130,.35);
    --nx-max:1080px;

    font-family:"Poppins","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--nx-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .nx-lp *{box-sizing:border-box;}

  .nx-wrap{max-width:var(--nx-max);margin:0 auto;padding:0 22px;}
  .nx-section{padding:72px 0;}
  .nx-eyebrow{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--nx-violet-2);margin-bottom:14px;
  }
  .nx-h1{font-size:clamp(30px,5vw,46px);line-height:1.12;font-weight:800;color:var(--nx-ink);margin:0 0 22px;}
  .nx-h2{font-size:clamp(26px,3.6vw,36px);line-height:1.15;font-weight:800;color:var(--nx-ink);margin:0 0 14px;}
  .nx-h3{font-size:19px;font-weight:700;color:var(--nx-ink);margin:0 0 8px;}
  .nx-lead{font-size:17px;color:var(--nx-body);}
  .nx-center{text-align:center;}

  /* --- Boutons --- */
  .nx-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(135deg,var(--nx-violet-2),var(--nx-violet));
    color:#fff;text-decoration:none;font-weight:700;font-size:16px;
    padding:16px 30px;border-radius:999px;border:0;cursor:pointer;
    box-shadow:0 12px 26px -10px rgba(109,40,217,.7);
    transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
  }
  .nx-btn:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 18px 32px -12px rgba(109,40,217,.8);}
  .nx-btn svg{width:18px;height:18px;flex:none;}
  .nx-btn-ghost{
    display:inline-flex;align-items:center;gap:8px;color:var(--nx-violet-2);
    font-weight:700;text-decoration:none;font-size:15px;
  }
  .nx-btn-ghost:hover{text-decoration:underline;}
  .nx-btn-light{background:#fff;color:var(--nx-violet);box-shadow:0 12px 26px -12px rgba(0,0,0,.35);}
  .nx-btn-light:hover{filter:none;background:#faf7ff;}

  /* --- Header / nav simple --- */
  .nx-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;max-width:var(--nx-max);margin:0 auto;}
  .nx-logo{font-weight:800;font-size:22px;color:var(--nx-white);letter-spacing:.04em;}
  .nx-logo.dark{color:var(--nx-ink);}

  /* --- HERO --- */
  .nx-hero{
    background:radial-gradient(120% 120% at 80% 0%,#5a1596 0%,var(--nx-violet-deep) 55%,#1a0730 100%);
    color:#efe9fb;position:relative;overflow:hidden;
  }
  .nx-hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:56px 0 72px;}
  .nx-hero h1{color:#fff;}
  .nx-badge{
    display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    color:#fff;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:7px 14px;border-radius:999px;margin-bottom:20px;
  }
  .nx-checks{list-style:none;padding:0;margin:0 0 30px;display:grid;gap:14px;}
  .nx-checks li{display:flex;gap:12px;align-items:flex-start;font-size:16px;color:#e8e0f7;}
  .nx-checks .ic{
    flex:none;width:24px;height:24px;border-radius:50%;
    background:linear-gradient(135deg,#a855f7,#7C3AED);
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .nx-checks .ic svg{width:13px;height:13px;color:#fff;}

  /* --- Ebook mockup (dessiné en CSS, remplaçable par une image) --- */
  .nx-book-stage{display:flex;justify-content:center;align-items:center;perspective:1400px;}
  .nx-book{
    width:min(300px,80%);aspect-ratio:3/4;border-radius:10px 16px 16px 10px;
    background:linear-gradient(150deg,#3a0a63,#6d28d9 60%,#8b2fd6);
    box-shadow:0 40px 60px -25px rgba(0,0,0,.6),inset 14px 0 22px -14px rgba(0,0,0,.55);
    transform:rotateY(-16deg) rotateX(4deg);color:#fff;padding:26px 24px;
    display:flex;flex-direction:column;justify-content:space-between;border-left:6px solid rgba(0,0,0,.35);
  }
  .nx-book .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;}
  .nx-book .t{font-size:26px;font-weight:800;line-height:1.15;}
  .nx-book .n{font-size:13px;opacity:.85;}

  /* --- Cards « découvrir » --- */
  .nx-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:38px 0 30px;}
  .nx-card{
    background:#fff;border:1px solid var(--nx-line);border-radius:var(--nx-radius);
    padding:26px 24px;box-shadow:var(--nx-shadow);
  }
  .nx-logos{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .nx-logo-chip{
    width:40px;height:40px;border-radius:10px;background:var(--nx-soft);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--nx-violet);
    font-size:13px;border:1px solid var(--nx-line);
  }
  .nx-card p{margin:0;font-size:15px;color:var(--nx-body);}

  /* --- Auteurs --- */
  .nx-authors{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;}
  .nx-photo{
    border-radius:var(--nx-radius);aspect-ratio:4/3;width:100%;object-fit:cover;
    background:linear-gradient(135deg,var(--nx-soft),#e3d7f7);border:1px solid var(--nx-line);
    display:flex;align-items:center;justify-content:center;color:var(--nx-muted);font-size:14px;
  }

  /* --- CTA formations (carte colorée) --- */
  .nx-cta-card{
    background:linear-gradient(135deg,var(--nx-accent-a),var(--nx-accent-b));
    color:#fff;border-radius:24px;padding:52px 44px;box-shadow:0 30px 60px -24px rgba(219,39,119,.5);
  }
  .nx-cta-card .nx-h2{color:#fff;}
  .nx-cta-card p{color:rgba(255,255,255,.92);font-size:16px;max-width:620px;margin:0 0 26px;}

  /* --- Témoignages --- */
  .nx-ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px;}
  .nx-rating{
    background:#fff;border:1px solid var(--nx-line);border-radius:var(--nx-radius);
    padding:26px 20px;text-align:center;box-shadow:var(--nx-shadow);
  }
  .nx-rating .score{font-size:34px;font-weight:800;color:var(--nx-ink);}
  .nx-stars{color:#f5a623;font-size:18px;letter-spacing:2px;margin:6px 0;}
  .nx-rating .rev{font-size:13px;color:var(--nx-muted);}
  .nx-quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px;}
  .nx-quote{background:var(--nx-soft);border-radius:var(--nx-radius);padding:24px;font-size:15px;color:var(--nx-body);}
  .nx-quote .who{margin-top:14px;font-weight:700;color:var(--nx-ink);font-size:14px;}

  /* --- Formulaire --- */
  .nx-form-band{background:var(--nx-soft);}
  .nx-form{
    max-width:560px;margin:26px auto 0;background:#fff;border:1px solid var(--nx-line);
    border-radius:var(--nx-radius);padding:30px;box-shadow:var(--nx-shadow);
  }
  .nx-form .row{display:grid;gap:14px;margin-bottom:14px;}
  @media(min-width:560px){.nx-form .row.two{grid-template-columns:1fr 1fr;}}
  .nx-form label{display:block;font-size:13px;font-weight:600;color:var(--nx-ink);margin-bottom:6px;}
  .nx-form input{
    width:100%;padding:13px 15px;border:1px solid var(--nx-line);border-radius:10px;
    font-size:15px;font-family:inherit;color:var(--nx-ink);background:#fff;
  }
  .nx-form input:focus{outline:none;border-color:var(--nx-violet-2);box-shadow:0 0 0 3px rgba(109,40,217,.15);}
  .nx-form .nx-btn{width:100%;margin-top:6px;}
  .nx-consent{font-size:12px;color:var(--nx-muted);margin-top:12px;text-align:center;}

  /* --- Footer --- */
  .nx-footer{background:var(--nx-ink);color:#cfc7e0;}
  .nx-footer .nx-wrap{padding-top:54px;padding-bottom:34px;}
  .nx-foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:34px;}
  .nx-footer h4{color:#fff;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px;}
  .nx-footer a{color:#cfc7e0;text-decoration:none;}
  .nx-footer a:hover{color:#fff;}
  .nx-footer ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;font-size:15px;}
  .nx-legal{border-top:1px solid rgba(255,255,255,.12);margin-top:34px;padding-top:22px;font-size:12px;color:#9b90b8;}
  .nx-legal p{margin:0 0 8px;}

  /* --- Responsive --- */
  @media(max-width:860px){
    .nx-hero-grid{grid-template-columns:1fr;gap:36px;}
    .nx-cards{grid-template-columns:1fr;}
    .nx-authors{grid-template-columns:1fr;gap:26px;}
    .nx-ratings,.nx-quotes{grid-template-columns:1fr;}
    .nx-foot-grid{grid-template-columns:1fr;gap:26px;}
    .nx-section{padding:52px 0;}
    .nx-cta-card{padding:36px 26px;}
    .nx-book{transform:none;}
  }
</style>
